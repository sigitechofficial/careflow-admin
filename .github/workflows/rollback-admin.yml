name: Rollback Careflow Admin

on:
  workflow_dispatch:
    inputs:
      rollback_type:
        description: "Choose rollback action"
        required: true
        type: choice
        options:
          - latest-backup
          - previous-release
          - specific-release
          - specific-backup
          - list-available

      target:
        description: "Required only for specific-release or specific-backup. Example: commit SHA or backup-20260513185927.tar.gz"
        required: false
        type: string

      confirmation:
        description: "Type ROLLBACK to confirm. Not required for list-available."
        required: false
        type: string

      deploy_target:
        description: "Which admin site to roll back (careflowadmin = main site, allforcare = production branch site)"
        required: true
        type: choice
        default: careflowadmin
        options:
          - careflowadmin
          - allforcare

concurrency:
  group: careflow-admin-${{ github.event.inputs.deploy_target }}-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback Admin From GitHub UI
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      ADMIN_DEPLOY_PATH: ${{ secrets.ADMIN_DEPLOY_PATH }}
      ADMIN_APP_URL: ${{ secrets.ADMIN_APP_URL }}
      ROLLBACK_TYPE: ${{ github.event.inputs.rollback_type }}
      TARGET: ${{ github.event.inputs.target }}
      CONFIRMATION: ${{ github.event.inputs.confirmation }}

    steps:
      - name: Validate rollback confirmation
        run: |
          if [ "$ROLLBACK_TYPE" = "list-available" ]; then
            echo "Listing available rollback options. Confirmation not required."
            exit 0
          fi

          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "Rollback blocked. Type ROLLBACK in confirmation field."
            exit 1
          fi

      - name: Configure SSH access
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          VPS_PORT="${VPS_PORT:-22}"

          echo "Adding VPS host key to known_hosts..."

          for i in 1 2 3 4 5; do
            ssh-keyscan -T 20 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Failed to add VPS host key."
            exit 1
          fi

          echo "SSH access configured."

      - name: Run rollback command on VPS
        run: |
          set -e

          VPS_PORT="${VPS_PORT:-22}"

          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" << 'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_TARGET="${{ github.event.inputs.deploy_target }}"
          ROLLBACK_TYPE="${{ github.event.inputs.rollback_type }}"
          TARGET="${{ github.event.inputs.target }}"

          if [ "$DEPLOY_TARGET" = "allforcare" ]; then
            LIVE_PATH="/home/sigisolutions/allforcare.sigisolutions.net"
            APP_URL="https://allforcare.sigisolutions.net/"
            DEPLOY_ROOT="/home/sigisolutions/deployments/allforcare-admin"
          else
            LIVE_PATH="${{ secrets.ADMIN_DEPLOY_PATH }}"
            APP_URL="${{ secrets.ADMIN_APP_URL }}"
            DEPLOY_ROOT="/home/sigisolutions/deployments/careflow-admin"
          fi

          RELEASES_DIR="$DEPLOY_ROOT/releases"
          BACKUPS_DIR="$DEPLOY_ROOT/backups"
          ROLLBACK_TEMP="$DEPLOY_ROOT/manual-rollback-temp"
          PRE_ROLLBACK_BACKUP="$BACKUPS_DIR/pre-rollback-$(date +%Y%m%d%H%M%S).tar.gz"
          ROLLBACK_LOG="$DEPLOY_ROOT/logs/rollbacks.log"

          mkdir -p "$DEPLOY_ROOT/logs"
          mkdir -p "$BACKUPS_DIR"

          echo "Rollback type: $ROLLBACK_TYPE"

          if [ "$ROLLBACK_TYPE" = "list-available" ]; then
            echo ""
            echo "Current release:"
            if [ -f "$DEPLOY_ROOT/current-release.txt" ]; then
              cat "$DEPLOY_ROOT/current-release.txt"
            else
              echo "No current-release.txt found"
            fi

            echo ""
            echo "Available releases:"
            ls -1dt "$RELEASES_DIR"/* 2>/dev/null | sed 's#.*/##' | head -n 10 || true

            echo ""
            echo "Available backups:"
            ls -1t "$BACKUPS_DIR"/backup-*.tar.gz 2>/dev/null | sed 's#.*/##' | head -n 10 || true

            echo ""
            echo "Available pre-rollback backups:"
            ls -1t "$BACKUPS_DIR"/pre-rollback-*.tar.gz 2>/dev/null | sed 's#.*/##' | head -n 10 || true

            exit 0
          fi

          echo "Creating pre-rollback backup of current live files..."
          tar \
            --exclude=".well-known" \
            --exclude="cgi-bin" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="*.pem" \
            --exclude="*.key" \
            -czf "$PRE_ROLLBACK_BACKUP" \
            -C "$LIVE_PATH" .

          SOURCE_TYPE=""
          SOURCE_PATH=""

          if [ "$ROLLBACK_TYPE" = "latest-backup" ]; then
            SOURCE_TYPE="backup"
            SOURCE_PATH="$(ls -1t "$BACKUPS_DIR"/backup-*.tar.gz 2>/dev/null | head -n 1 || true)"

            if [ -z "$SOURCE_PATH" ]; then
              echo "No backup found for rollback."
              exit 1
            fi
          fi

          if [ "$ROLLBACK_TYPE" = "previous-release" ]; then
            SOURCE_TYPE="release"

            CURRENT_RELEASE=""
            if [ -f "$DEPLOY_ROOT/current-release.txt" ]; then
              CURRENT_RELEASE="$(cat "$DEPLOY_ROOT/current-release.txt")"
            fi

            SOURCE_PATH="$(ls -1dt "$RELEASES_DIR"/* 2>/dev/null | grep -v "$CURRENT_RELEASE" | head -n 1 || true)"

            if [ -z "$SOURCE_PATH" ]; then
              echo "No previous release found for rollback."
              exit 1
            fi
          fi

          if [ "$ROLLBACK_TYPE" = "specific-release" ]; then
            SOURCE_TYPE="release"

            if [ -z "$TARGET" ]; then
              echo "Target is required for specific-release."
              exit 1
            fi

            SOURCE_PATH="$RELEASES_DIR/$TARGET"

            if [ ! -d "$SOURCE_PATH" ]; then
              echo "Specific release folder not found: $SOURCE_PATH"
              exit 1
            fi
          fi

          if [ "$ROLLBACK_TYPE" = "specific-backup" ]; then
            SOURCE_TYPE="backup"

            if [ -z "$TARGET" ]; then
              echo "Target is required for specific-backup."
              exit 1
            fi

            if [[ "$TARGET" = /* ]]; then
              SOURCE_PATH="$TARGET"
            else
              SOURCE_PATH="$BACKUPS_DIR/$TARGET"
            fi

            if [ ! -f "$SOURCE_PATH" ]; then
              echo "Specific backup file not found: $SOURCE_PATH"
              exit 1
            fi
          fi

          echo "Selected rollback source type: $SOURCE_TYPE"
          echo "Selected rollback source path: $SOURCE_PATH"

          rm -rf "$ROLLBACK_TEMP"
          mkdir -p "$ROLLBACK_TEMP"

          if [ "$SOURCE_TYPE" = "backup" ]; then
            tar -xzf "$SOURCE_PATH" -C "$ROLLBACK_TEMP"
            DEPLOY_SOURCE="$ROLLBACK_TEMP"
          else
            DEPLOY_SOURCE="$SOURCE_PATH"
          fi

          test -f "$DEPLOY_SOURCE/index.html"

          echo "Syncing rollback source to live folder..."
          rsync -az --delete \
            --exclude=".htaccess" \
            --exclude=".well-known" \
            --exclude="cgi-bin" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="*.pem" \
            --exclude="*.key" \
            "$DEPLOY_SOURCE/" "$LIVE_PATH/"

          if [ ! -f "$LIVE_PATH/.htaccess" ]; then
            echo "Creating default React .htaccess..."
            cat > "$LIVE_PATH/.htaccess" <<'HTACCESS'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            RewriteRule ^ index.html [L]
          </IfModule>
          HTACCESS
            chmod 644 "$LIVE_PATH/.htaccess"
          fi

          if [ "$SOURCE_TYPE" = "release" ]; then
            basename "$SOURCE_PATH" > "$DEPLOY_ROOT/current-release.txt"
          else
            echo "rollback-from-backup-$(date +%Y%m%d%H%M%S)" > "$DEPLOY_ROOT/current-release.txt"
          fi

          echo "Checking live website..."
          curl -fsS --retry 3 "$APP_URL" > /dev/null

          {
            echo "rollback_type=$ROLLBACK_TYPE"
            echo "target=$TARGET"
            echo "source=$SOURCE_PATH"
            echo "pre_rollback_backup=$PRE_ROLLBACK_BACKUP"
            echo "actor=${{ github.actor }}"
            echo "run_id=${{ github.run_id }}"
            echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "---"
          } >> "$ROLLBACK_LOG"

          rm -rf "$ROLLBACK_TEMP"

          echo "Rollback completed successfully."
          REMOTE_SCRIPT